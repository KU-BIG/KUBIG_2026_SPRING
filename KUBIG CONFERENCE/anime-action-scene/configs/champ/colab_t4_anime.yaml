exp_name: champ_anythingv5

# ─── 해상도 & 프레임 (T4 16GB 최적화) ─────────────────────────────────────────
width:  384
height: 512

data:
  ref_image_path: '../inputs/ref.png'
  guidance_data_folder: '../outputs/guidance'
  frame_range: [0, 32]

seed: 42

# ─── Anything V5 베이스 모델 (SD 1.5 UNet 교체) ─────────────────────────────
base_model_path: '../pretrained_weights/anything-v5'
vae_model_path:  '../pretrained_weights/sd-vae-ft-mse'
image_encoder_path: '../pretrained_weights/image_encoder'
ckpt_dir: '../pretrained_weights/champ'
motion_module_path: '../pretrained_weights/champ/motion_module.pth'

num_inference_steps: 20
guidance_scale: 3.5
enable_zero_snr: true
weight_dtype: "fp16"

guidance_types:
  - 'depth'
  - 'normal'
  - 'dwpose'

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:   0.00085
  beta_end:     0.012
  beta_schedule: "linear"
  steps_offset: 1
  clip_sample:  false

unet_additional_kwargs:
  use_inflated_groupnorm: true
  unet_use_cross_frame_attention: false
  unet_use_temporal_attention: false
  use_motion_module: true
  motion_module_resolutions: [1, 2, 4, 8]
  motion_module_mid_block: true
  motion_module_decoder_only: false
  motion_module_type: Vanilla
  motion_module_kwargs:
    num_attention_heads: 8
    num_transformer_block: 1
    attention_block_types: [Temporal_Self, Temporal_Self]
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 32
    temporal_attention_dim_div: 1

guidance_encoder_kwargs:
  guidance_embedding_channels: 320
  guidance_input_channels: 3
  block_out_channels: [16, 32, 96, 256]

enable_xformers_memory_efficient_attention: true
