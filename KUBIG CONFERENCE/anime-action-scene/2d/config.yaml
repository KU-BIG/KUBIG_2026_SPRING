# 2d/config.yaml
# Moore-AnimateAnyone inference wrapper 설정
#
# CLI 플래그가 항상 이 값들보다 우선한다:
#   --ref/--video/--out  --noise  -W  -H  -L  --steps  --cfg  --seed  --fps
# upstream의 configs/prompts/*.yaml과 달리 여기엔 test_cases 배치가 없다 — 입력은
# CLI로 한 건씩 받는다. 이 파일은 경로 + 생성 옵션만 담는다.

# --- 가중치 (상대경로는 weights_dir 아래로 resolve; download_weights.py 참고) ---
weights_dir: weights
base_sd:         stable-diffusion-v1-5   # base SD1.5 폴더 (unet/ 포함해야 함)
vae:             sd-vae-ft-mse
image_encoder:   image_encoder
motion_module:   motion_module.pth
denoising_unet:  denoising_unet.pth
reference_unet:  reference_unet.pth
pose_guider:     pose_guider.pth

# 엔진 설정, submodule 안쪽에 있음 (옮기지 말 것)
inference_config: configs/inference/inference_v2.yaml

# --- 생성 옵션 ---
weight_dtype: fp16        # fp16 | fp32
width:  512
height: 784
length: 24                # 목표 프레임 수 (video_length); driving 영상 프레임 수로 capped
steps:  30
cfg:    3.5               # classifier-free guidance scale
seed:   42
fps:                      # 비워두면 -> driving video의 fps 사용

# --- 노이즈 전략 (필수 옵션: --noise) ----------------------------------------------------
# iid       : 프레임마다 독립적인 noise (기본값; 자유로운 움직임, flicker 가능)
# repeat    : 한 프레임의 noise를 모든 프레임에 복사 (일관성 최대, 움직임 감소)
# freenoise : window 재사용 + local shuffle (긴 영상에서도 일관성 유지, tuning 불필요)
noise: iid

# noise: freenoise 일 때만 사용되며, length > window_size 일 때만 효과가 있다.
# 기본값은 pipeline의 context window와 맞춤 (context_frames=24, context_overlap=4).
freenoise:
  window_size:   24
  window_stride:  4
